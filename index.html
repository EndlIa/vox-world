<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vox-world</title>
    <style>
      :root {
        --panel: #1b1d21;
        --panel-2: #24272c;
        --line: #34383f;
        --text: #e6e8ea;
        --dim: #9aa2ad;
        --accent: #4da3ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #101215; color: var(--text);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
      #app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 1fr auto;
        grid-template-areas: "panels viewport" "timeline timeline"; height: 100vh; }
      #viewport { grid-area: viewport; width: 100%; height: 100%; display: block; background: #0b0d10; }
      #panels { grid-area: panels; overflow-y: auto; border-right: 1px solid var(--line);
        background: var(--panel); padding: 8px; }
      #timeline { grid-area: timeline; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 8px; }
      #hud { position: fixed; top: 8px; right: 8px; z-index: 10; background: rgba(27, 29, 33, 0.88);
        border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 220px;
        pointer-events: none; white-space: pre; color: var(--dim); }
      #hud b { color: var(--text); font-weight: 600; }
      section { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: var(--panel-2); }
      section > h2 { margin: 0; padding: 5px 8px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--dim); border-bottom: 1px solid var(--line); }
      section > div { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
      label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      button, select, input { background: #14171a; color: var(--text); border: 1px solid var(--line);
        border-radius: 3px; padding: 3px 6px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { border-color: var(--accent); color: var(--accent); }
      input[type="number"] { width: 76px; }
      input[type="color"] { width: 34px; height: 22px; padding: 0; }
      .row { display: flex; gap: 4px; flex-wrap: wrap; }
      .row > * { flex: 1 1 auto; }
      .dim { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="panels"></div>
      <canvas id="viewport"></canvas>
      <div id="timeline"></div>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
