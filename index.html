<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vox-world</title>
    <style>
      :root {
        --panel: #1b1d21;
        --panel-2: #24272c;
        --line: #34383f;
        --text: #e6e8ea;
        --dim: #9aa2ad;
        --accent: #4da3ff;
        /* The viewport background. Must stay equal to `DEFAULT_BACKGROUND` in src/document/project.ts,
           which is what the 3D scene and every exported frame use. */
        --scene: #3d4250;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--scene); color: var(--text);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
      #app { position: relative; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr auto;
        grid-template-areas: "viewport" "timeline"; height: 100vh; }
      /* A canvas carries an intrinsic size taken from its drawing-buffer attributes, and a grid item's automatic
         minimum would floor this row with it: the timeline row below would then be pushed past the bottom of the
         100vh column and clipped away, which is what made the bar impossible to see. `min-height: 0` lets the row
         shrink to what is left, and the app resizes the drawing buffer to the new box (README D44). */
      #viewport { grid-area: viewport; width: 100%; height: 100%; min-height: 0; display: block; background: var(--scene); }
      /* The viewport's mode switch: the canvas' own grid area, pinned to its bottom centre and sized to its
         buttons, so it never covers drawing space it does not need. Above the HUD, below the rail and the
         windows, which is the same order the rest of the chrome stacks in. */
      #modebar { grid-area: viewport; justify-self: center; align-self: end; margin-bottom: 32px; z-index: 11;
        display: flex; gap: 4px; }
      /* The rail is an overlay on the canvas, not a reserved column: the viewport keeps the whole window
         width, and only the buttons and the status text take up any of it. The windows the rail opens are
         `position: fixed` (`.window`), so they leave this box entirely and never widen it. */
      #panels { position: absolute; left: 0; top: 0; z-index: 12; width: 112px; max-height: 100%;
        display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow-y: auto;
        pointer-events: none; }
      #panels > * { pointer-events: auto; }
      /* The rail is the overlay's first row whatever order the app added nodes in: the app appends its status
         line to this element before the panel is constructed, so document order alone would put that text
         above the buttons. */
      .rail { order: -1; display: flex; flex-direction: column; gap: 4px; }
      .rail button { width: 100%; text-align: left; }
      /* The status text, the progress row, and the error line are read over the canvas, so each carries its
         own translucent ground — the same treatment `#hud` gets. An empty one is not shown at all: the
         progress row is hidden by `Panels` while no job reports, and an empty error line disappears here. */
      #panels > div:not(.rail) { background: rgba(16, 18, 21, 0.86); border: 1px solid var(--line);
        border-radius: 3px; padding: 4px 5px; }
      #panels > div:empty { display: none; }
      /* A group's controls in a floating window: over the HUD (`z-index: 10`). `raise()` renumbers inline
         z-index from this base, never higher than the windows in the column, and the voxelize modal is not
         a rung of that ladder at all — it is a native `dialog` in the top layer, over every one of these. A
         closed window is `hidden` and keeps every node it holds. */
      .window { position: fixed; z-index: 15; display: flex; flex-direction: column;
        width: 300px; max-height: calc(100vh - 16px); }
      .window[hidden] { display: none; }
      .window > h2 { display: flex; align-items: center; justify-content: space-between; gap: 6px;
        cursor: move; user-select: none; }
      .window > div { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      /* A group's divider: separates the half of a window that acts on every object from the half that acts
         on the selected one. It is a flex item like the controls around it, so it spans the body's width. */
      .window > div > hr { width: 100%; margin: 0; border: 0; border-top: 1px solid var(--line); }
      .window-close { padding: 0 4px; line-height: 1; font-size: 13px; }
      /* The voxelize modal: a native `<dialog>` opened with `showModal()`, so it is the platform that stacks
         it — a top layer over every window and the HUD — and the reset below is what leaves the `section`
         card built inside it as the only visible box. `::backdrop` is the translucent ground the page shows
         through while the prompt is up. */
      dialog { border: 0; padding: 0; background: none; color: inherit; }
      dialog::backdrop { background: rgba(16, 18, 21, 0.72); }
      #timeline { grid-area: timeline; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 8px; }
      #hud { position: fixed; top: 8px; right: 8px; z-index: 10; background: rgba(27, 29, 33, 0.88);
        border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 220px;
        pointer-events: none; white-space: pre; color: var(--dim); }
      #hud b { color: var(--text); font-weight: 600; }
      section { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: var(--panel-2); }
      section > h2 { margin: 0; padding: 5px 8px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--dim); border-bottom: 1px solid var(--line); }
      section > div { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
      label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      button, select, input { background: #14171a; color: var(--text); border: 1px solid var(--line);
        border-radius: 3px; padding: 3px 6px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { border-color: var(--accent); color: var(--accent); }
      input[type="number"] { width: 76px; }
      input[type="color"] { width: 34px; height: 22px; padding: 0; }
      .row { display: flex; gap: 4px; flex-wrap: wrap; }
      .row > * { flex: 1 1 auto; }
      /* `display: flex` beats the user-agent's `[hidden] { display: none }`, so the progress row has to be
         hidden explicitly while no job is reporting. */
      .row[hidden] { display: none; }
      /* An object row: the name takes the width — and truncates rather than pushing the trash out — and
         the trash that deletes that object sits at the right end of the row the user clicked. */
      .obj-row { display: flex; align-items: stretch; gap: 4px; }
      .obj-row > button:first-child { flex: 1 1 auto; min-width: 0; text-align: left;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row-del { flex: 0 0 auto; display: inline-flex; align-items: center; padding: 0 5px; color: var(--dim); }
      .row-del:hover { color: var(--text); }
      /* An unavailable control has to say so: every control carries an explicit `color`, which would keep a
         disabled one looking live, so the text drops to `--dim` and the control is dimmed whole. It takes no
         pointer events either, so no hover rule can light it up. */
      button:disabled, select:disabled, input:disabled { color: var(--dim); opacity: 0.55; }
      .dim { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="panels"></div>
      <canvas id="viewport"></canvas>
      <div id="modebar"></div>
      <!-- The timeline bar starts collapsed and the rail's `Animation` button is what shows it (README D44). The
           attribute lives here rather than being set by the module so the bar cannot flash while the bundle loads. -->
      <div id="timeline" hidden></div>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
